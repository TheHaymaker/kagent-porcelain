# cloudrun-mcp: Workbench Cloud Run PREVIEW deployments (wb-preview-* services in the preview project only; no production deploys)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudrun-mcp
  namespace: workbench-tools
  annotations:
    # Workload Identity: bind this KSA to the GSA (roles in tools/README.md).
    iam.gke.io/gcp-service-account: wb-cloudrun-mcp@WB_PLATFORM_PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudrun-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: cloudrun-mcp
    app.kubernetes.io/part-of: workbench
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudrun-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudrun-mcp
        app.kubernetes.io/part-of: workbench
    spec:
      serviceAccountName: cloudrun-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: REGISTRY/workbench/cloudrun-mcp:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Set "true" once the harness forwards X-User-Id (see README, "Caller identity").
            - name: REQUIRE_REQUESTER
              value: "false"
            - name: CLOUDRUN_PREVIEW_PROJECT
              value: WB_PREVIEW_PROJECT
            - name: CLOUDRUN_REGION
              value: europe-west1
            - name: WB_PRODUCTION_PROJECTS
              value: WB_PRODUCTION_PROJECT
            - name: CLOUDRUN_IMAGE_PREFIX
              value: europe-west1-docker.pkg.dev/WB_BUILDS_PROJECT/builds/
            - name: CLOUDRUN_RUNTIME_SERVICE_ACCOUNT
              value: wb-preview-runtime@WB_PREVIEW_PROJECT.iam.gserviceaccount.com
            - name: CLOUDRUN_MAX_INSTANCES
              value: "2"
            - name: CLOUDRUN_INVOKER_DOMAINS
              value: example.com
            - name: CLOUDRUN_ALLOW_PUBLIC_INVOKER
              value: "false"
            - name: CLOUDRUN_DEPLOY_WAIT
              value: 3m
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudrun-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: cloudrun-mcp
spec:
  selector:
    app.kubernetes.io/name: cloudrun-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: cloudrun-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/part-of: workbench
spec:
  description: "Workbench Cloud Run PREVIEW deployments (wb-preview-* services in the preview project only; no production deploys)"
  protocol: STREAMABLE_HTTP
  url: http://cloudrun-mcp.workbench-tools.svc.cluster.local:8080/mcp
  timeout: 300s
  allowedNamespaces:
    from: Selector
    selector:
      matchLabels:
        workbench.dev/builder-agents: "true"
