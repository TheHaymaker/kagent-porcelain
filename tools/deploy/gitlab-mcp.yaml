# gitlab-mcp: Workbench GitLab: scaffold projects, branches, commits, merge requests and pipeline status in the Workbench group
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-mcp
  namespace: workbench-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: gitlab-mcp
    app.kubernetes.io/part-of: workbench
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-mcp
        app.kubernetes.io/part-of: workbench
    spec:
      serviceAccountName: gitlab-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: REGISTRY/workbench/gitlab-mcp:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Set "true" once the harness forwards X-User-Id (see README, "Caller identity").
            - name: REQUIRE_REQUESTER
              value: "false"
            - name: GITLAB_BASE_URL
              value: https://gitlab.example.com
            - name: GITLAB_ALLOWED_GROUP
              value: workbench/apps
            - name: GITLAB_TEMPLATE_GROUP
              value: workbench/templates
            - name: GITLAB_TOKEN_FILE
              value: /var/run/secrets/workbench/gitlab/token
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: gitlab-token
              mountPath: /var/run/secrets/workbench/gitlab
              readOnly: true
      volumes:
        # Create separately; never commit it:
        #   kubectl -n workbench-tools create secret generic gitlab-mcp-token --from-file=token=./token
        - name: gitlab-token
          secret:
            secretName: gitlab-mcp-token
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: gitlab-mcp
spec:
  selector:
    app.kubernetes.io/name: gitlab-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: gitlab-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/part-of: workbench
spec:
  description: "Workbench GitLab: scaffold projects, branches, commits, merge requests and pipeline status in the Workbench group"
  protocol: STREAMABLE_HTTP
  url: http://gitlab-mcp.workbench-tools.svc.cluster.local:8080/mcp
  timeout: 60s
  allowedNamespaces:
    from: Selector
    selector:
      matchLabels:
        workbench.dev/builder-agents: "true"
