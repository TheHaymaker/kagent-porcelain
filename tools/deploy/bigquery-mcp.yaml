# bigquery-mcp: Workbench BigQuery: browse, dry-run, capped read-only queries, create datasets, delete tables in Workbench datasets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bigquery-mcp
  namespace: workbench-tools
  annotations:
    # Workload Identity: bind this KSA to the GSA (roles in tools/README.md).
    iam.gke.io/gcp-service-account: wb-bigquery-mcp@WB_PLATFORM_PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bigquery-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: bigquery-mcp
    app.kubernetes.io/part-of: workbench
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bigquery-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bigquery-mcp
        app.kubernetes.io/part-of: workbench
    spec:
      serviceAccountName: bigquery-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: REGISTRY/workbench/bigquery-mcp:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Set "true" once the harness forwards X-User-Id (see README, "Caller identity").
            - name: REQUIRE_REQUESTER
              value: "false"
            - name: BQ_PROJECT
              value: WB_DATA_PROJECT
            - name: BQ_LOCATION
              value: EU
            - name: BQ_MAX_BYTES_BILLED
              value: "1073741824"
            - name: BQ_MAX_ROWS
              value: "200"
            - name: BQ_DATASET_PREFIX
              value: wb_
            - name: BQ_QUERY_TIMEOUT
              value: 60s
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: bigquery-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/name: bigquery-mcp
spec:
  selector:
    app.kubernetes.io/name: bigquery-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: bigquery-mcp
  namespace: workbench-tools
  labels:
    app.kubernetes.io/part-of: workbench
spec:
  description: "Workbench BigQuery: browse, dry-run, capped read-only queries, create datasets, delete tables in Workbench datasets"
  protocol: STREAMABLE_HTTP
  url: http://bigquery-mcp.workbench-tools.svc.cluster.local:8080/mcp
  timeout: 120s
  allowedNamespaces:
    from: Selector
    selector:
      matchLabels:
        workbench.dev/builder-agents: "true"
