{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-web-config
data:
  config.json: |
    {{- toJson .Values.web.runtimeConfig | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbench-web
  labels:
    app.kubernetes.io/name: workbench-web
spec:
  # One replica with the waker: each would otherwise keep its own idle clock.
  replicas: {{ if .Values.web.waker.enabled }}1{{ else }}{{ .Values.web.replicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: workbench-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbench-web
      annotations:
        checksum/config: {{ toJson .Values.web.runtimeConfig | sha256sum }}
    spec:
      {{- if .Values.web.waker.enabled }}
      serviceAccountName: workbench-web
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        {{- with .Values.web.waker }}
        {{- if .enabled }}
        # Pauses the workload node pool when idle; starts it on traffic.
        - name: waker
          image: {{ .image }}
          env:
            - { name: WAKER_PROJECT, value: {{ .project | quote }} }
            - { name: WAKER_LOCATION, value: {{ .location | quote }} }
            - { name: WAKER_CLUSTER, value: {{ .cluster | quote }} }
            - { name: WAKER_POOL, value: {{ .pool | quote }} }
            - { name: WAKER_NODES, value: {{ .nodes | quote }} }
            - { name: WAKER_IDLE, value: {{ .idle | quote }} }
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        {{- end }}
        {{- end }}
        - name: web
          image: {{ .Values.web.image }}
          ports:
            - containerPort: 8080
          env:
            # nginx proxies /api to the Workbench server, same origin as the app.
            - name: API_UPSTREAM
              value: http://{{ .Values.kagent.fullname }}-controller.{{ .Release.Namespace }}.svc:8083
            {{- if .Values.web.waker.enabled }}
            # nginx tells the waker about API traffic, and sends it API
            # requests the paused server cannot answer (web/nginx template).
            - name: WAKER_ACTIVITY
              value: "proxy_pass http://127.0.0.1:8081/activity;"
            - name: WAKER_STARTING
              value: "rewrite ^ /starting break; proxy_pass http://127.0.0.1:8081;"
            {{- end }}
            {{- with .Values.web.authHandlerUpstream }}
            # Identity Platform's sign-in handler, proxied at /__/ (ADR 0005).
            - name: AUTH_HANDLER_UPSTREAM
              value: {{ . }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
            # The root filesystem is read-only; nginx renders its config and
            # keeps temp files here.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: workbench-web-config
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- if .Values.web.waker.enabled }}
---
# The waker counts the workload pool's nodes, finishes stalled drains, and
# resizes the pool (through Workload
# Identity: the Google role is granted to this account by deploy/gcp/up.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workbench-web
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workbench-waker
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  # Finishing a pause: pods left on the paused pool's nodes are deleted
  # when disruption budgets would hold the drain for an hour.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workbench-waker
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: workbench-waker}
subjects:
  - {kind: ServiceAccount, name: workbench-web, namespace: {{ .Release.Namespace }}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: workbench-web
  {{- with .Values.web.gke }}
  {{- if .backendConfig }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "workbench-web"}'
  {{- end }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: workbench-web
  ports:
    - port: 80
      targetPort: 8080
{{- if .Values.web.ingress.enabled }}
{{- with .Values.web.gke }}
{{- if .backendConfig }}
---
# GKE load balancer settings: streaming chat turns need a long backend
# timeout, health checks use nginx's /healthz, and an optional Cloud Armor
# policy limits who can reach the app (ADR 0005).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: workbench-web
spec:
  timeoutSec: {{ .backendConfig.timeoutSec | default 3600 }}
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
  {{- with .backendConfig.securityPolicy }}
  securityPolicy:
    name: {{ . }}
  {{- end }}
{{- end }}
{{- if .managedCertificate }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: workbench-web
spec:
  domains: [{{ $.Values.web.host }}]
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workbench-web
  {{- $annotations := deepCopy (.Values.web.ingress.annotations | default dict) }}
  {{- with .Values.web.gke }}
  {{- /* GKE reads its class from the annotation; the API rejects both forms at once. */}}
  {{- $_ := set $annotations "kubernetes.io/ingress.class" $.Values.web.ingress.className }}
  {{- if .staticIPName }}{{ $_ := set $annotations "kubernetes.io/ingress.global-static-ip-name" .staticIPName }}{{ end }}
  {{- if .managedCertificate }}
  {{- $_ := set $annotations "networking.gke.io/managed-certificates" "workbench-web" }}
  {{- $_ := set $annotations "kubernetes.io/ingress.allow-http" "false" }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.web.gke }}
  ingressClassName: {{ .Values.web.ingress.className }}
  {{- end }}
  {{- if not (and .Values.web.gke .Values.web.gke.managedCertificate) }}
  tls:
    - hosts: [{{ .Values.web.host }}]
      secretName: {{ .Values.web.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workbench-web
                port: { number: 80 }
{{- end }}
{{- end }}
