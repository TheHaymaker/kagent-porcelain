[project]
name = "workbench-app"
version = "0.1.0"
description = "Internal web tool built from the python-fastapi-cloudrun golden path"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
  "google-auth>=2.30,<3",
  "google-cloud-firestore>=2.19,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.uv]
package = false
