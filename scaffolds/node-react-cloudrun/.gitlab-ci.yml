# CI for a Workbench app: test, then build the image into Artifact Registry.
#
# There is deliberately NO deploy job. The Workbench builder deploys previews
# through the cloudrun-mcp tool, and production happens only after a Workbench
# approval (performed by Workbench with its own identity). CI never holds
# Cloud Run deploy rights.
#
# Required group-level CI/CD variables (set once on the workbench-apps group):
#   GCP_PROJECT_ID, GCP_REGION, AR_REPOSITORY
# and the group's Google Cloud IAM integration (Workload Identity Federation),
# so `identity: google_cloud` gives jobs short-lived credentials. No JSON keys.

stages: [test, build]

variables:
  IMAGE: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${CI_PROJECT_NAME}"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  image: node:22-bookworm-slim
  variables:
    npm_config_cache: .npm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  script:
    - npm ci --no-audit --no-fund
    - npm run check
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

build-image:
  stage: build
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  identity: google_cloud
  needs: [test]
  script:
    # Cloud Build builds the Dockerfile remotely and pushes to Artifact
    # Registry: no Docker daemon or privileged runner needed.
    - >
      gcloud builds submit .
      --project "$GCP_PROJECT_ID" --region "$GCP_REGION"
      --tag "$IMAGE:$CI_COMMIT_SHA"
      --default-buckets-behavior=regional-user-owned-bucket
      --suppress-logs
    - >
      DIGEST=$(gcloud artifacts docker images describe "$IMAGE:$CI_COMMIT_SHA"
      --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')
    - echo "IMAGE_REF=$IMAGE@$DIGEST" | tee image.env
  artifacts:
    reports:
      dotenv: image.env
