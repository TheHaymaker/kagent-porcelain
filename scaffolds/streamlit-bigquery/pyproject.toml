[project]
name = "workbench-app"
version = "0.1.0"
description = "Data app on BigQuery built from the streamlit-bigquery golden path"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.50,<2",
  "google-cloud-bigquery>=3.25,<4",
  "db-dtypes>=1.3,<2",
  "pandas>=2.2,<3",
  "google-auth>=2.30,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.uv]
package = false
