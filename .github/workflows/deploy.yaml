name: deploy

# Runs deploy/gcp/up.sh against a GCP test project, one phase at a time.
# Uses the service account key stored as a secret on the "deploy" environment.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: up.sh phase
        type: choice
        options: [check, infra, images, kagent, workbench, smoke, model, gitlab-find, gitlab-check, gitlab-setup, tools, builder, web-check, expose, unexpose, all, status, down]
        default: check
      project_id:
        description: GCP project
        default: gen-lang-client-0163423705
      region:
        description: GCP region
        default: us-central1
      tag:
        description: "Image tag to deploy; empty means the commit's short SHA. Set it to reuse images built by an earlier run."
        default: ""
      secret_name:
        description: Name of the Actions secret holding the service account key (JSON or base64 of it)
        default: GCP_SA_KEY_B64

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  up:
    name: up.sh ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 120
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      STATE_BUCKET: gs://${{ inputs.project_id }}-workbench-state
    steps:
      - uses: actions/checkout@v4

      # The secret may hold the JSON key itself or the key base64-encoded.
      # It is written to a private file on the runner and never printed.
      - name: Service account key
        env:
          KEY: ${{ secrets[inputs.secret_name] || secrets.GCP_SA_KEY_B64 || secrets.GCP_SA_KEY_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::No secret named '${{ inputs.secret_name }}' is visible to this job. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/gcp-sa-key.json"
          case "$KEY" in
            "{"*) printf '%s' "$KEY" > "$key_file" ;;
            *) printf '%s' "$KEY" | base64 -d > "$key_file" ;;
          esac
          python3 -c 'import json,sys; k=json.load(open(sys.argv[1])); assert k.get("type")=="service_account" and k.get("private_key"), "not a service account key"; print("Service account:", k["client_email"])' "$key_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign gcloud in
        run: gcloud auth activate-service-account --key-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      - name: Python YAML
        run: python3 -c "import yaml" 2>/dev/null || pip install pyyaml

      # up.sh keeps generated secrets (internal key, push signing key, the
      # smoke test's signing key) in deploy/gcp/.state. Runners keep nothing,
      # so the state lives in a private bucket in the test project.
      - name: Restore deploy state
        if: inputs.phase != 'check'
        run: |
          gcloud storage buckets describe "$STATE_BUCKET" >/dev/null 2>&1 ||
            gcloud storage buckets create "$STATE_BUCKET" --project "$PROJECT_ID" --location "$REGION" \
              --uniform-bucket-level-access --public-access-prevention
          mkdir -p deploy/gcp/.state/secrets
          gcloud storage rsync -r "$STATE_BUCKET/secrets" deploy/gcp/.state/secrets 2>/dev/null || true

      - name: up.sh ${{ inputs.phase }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # For expose: who may sign in, and from where. Secrets, not inputs,
          # so emails and IP addresses never appear in this public repo's logs.
          WORKBENCH_ADMINS: ${{ secrets.WORKBENCH_ADMINS }}
          WORKBENCH_ALLOWED_RANGES: ${{ secrets.WORKBENCH_ALLOWED_RANGES }}
          # The web app's OAuth client ID (public; a variable or a secret).
          WORKBENCH_GOOGLE_CLIENT_ID: ${{ vars.WORKBENCH_GOOGLE_CLIENT_ID || secrets.WORKBENCH_GOOGLE_CLIENT_ID }}
          # For the GitLab tool server; masked, never printed.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_BASE_URL: ${{ vars.GITLAB_BASE_URL || 'https://gitlab.com' }}
        run: |
          if [ -n "$INPUT_TAG" ]; then export TAG="$INPUT_TAG"; fi
          deploy/gcp/up.sh ${{ inputs.phase }}

      - name: Save deploy state
        if: always() && inputs.phase != 'check'
        run: |
          if [ -d deploy/gcp/.state/secrets ]; then
            gcloud storage rsync -r deploy/gcp/.state/secrets "$STATE_BUCKET/secrets"
          fi

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa-key.json"
