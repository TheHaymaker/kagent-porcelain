syntax = "proto3";

package workbench.v1;

import "google/protobuf/timestamp.proto";
import "workbench/v1/common.proto";

option go_package = "github.com/thehaymaker/kagent-porcelain/server/gen/workbench/v1;workbenchv1";

// AppService is the registry of every app Workbench has built, with its
// environments. Production is reached only through RequestPromotion.
service AppService {
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  rpc UpdateApp(UpdateAppRequest) returns (UpdateAppResponse);
  rpc ArchiveApp(ArchiveAppRequest) returns (ArchiveAppResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // RequestPromotion asks to put a preview revision into production. It
  // creates an approval of kind production deploy; the promotion runs when an
  // eligible approver allows it.
  rpc RequestPromotion(RequestPromotionRequest) returns (RequestPromotionResponse);
}

enum AppStatus {
  APP_STATUS_UNSPECIFIED = 0;
  APP_STATUS_BUILDING = 1;
  APP_STATUS_PREVIEW = 2;
  APP_STATUS_LIVE = 3;
  APP_STATUS_FAILED = 4;
  APP_STATUS_ARCHIVED = 5;
}

enum EnvironmentName {
  ENVIRONMENT_NAME_UNSPECIFIED = 0;
  ENVIRONMENT_NAME_PREVIEW = 1;
  ENVIRONMENT_NAME_PRODUCTION = 2;
}

message Environment {
  EnvironmentName name = 1;
  string url = 2;
  // The revision currently serving.
  string revision = 3;
  string image = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message App {
  string id = 1;
  string name = 2;
  string description = 3;
  Person owner = 4;
  AppStatus status = 5;
  string scaffold = 6;
  string repository_url = 7;
  // The conversation that built it.
  string session_id = 8;
  string agent = 9;
  repeated Environment environments = 10;
  // Month-to-date model and cloud cost in US cents.
  int64 cost_cents_mtd = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // The pending promotion approval, if any.
  string pending_approval_id = 14;
}

message ListAppsRequest {
  // Only apps owned by the caller.
  bool mine = 1;
  AppStatus status = 2;
  string query = 3;
  PageRequest page = 4;
}

message ListAppsResponse {
  repeated App apps = 1;
  PageResponse page = 2;
}

message GetAppRequest {
  string id = 1;
}

message GetAppResponse {
  App app = 1;
}

message UpdateAppRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

message UpdateAppResponse {
  App app = 1;
}

message ArchiveAppRequest {
  string id = 1;
}

message ArchiveAppResponse {
  App app = 1;
}

message Deployment {
  string id = 1;
  string app_id = 2;
  EnvironmentName environment = 3;
  string revision = 4;
  string image = 5;
  string url = 6;
  Person deployed_by = 7;
  // For production: the approval that allowed it.
  string approval_id = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListDeploymentsRequest {
  string app_id = 1;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

message RequestPromotionRequest {
  string app_id = 1;
  // The preview revision to promote; empty means what preview serves now.
  string revision = 2;
  string note = 3;
}

message RequestPromotionResponse {
  string approval_id = 1;
}
