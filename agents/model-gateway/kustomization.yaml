apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
configMapGenerator:
  - name: model-gateway-config
    namespace: workbench-system
    files:
      - config.yaml=litellm-config.yaml
    # Hash suffix kept: kustomize rewrites the Deployment's reference, so a
    # config change rolls the pods.
