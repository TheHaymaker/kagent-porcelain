# Agent: pairs the builder template with the Claude harness and grants the
# extra egress the build needs. Workbench creates one Session of this Agent per
# app conversation; each Session is its own Substrate Actor with a durable
# /data (the app's working copy lives in /data/workspace/<app>).
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: workbench-builder
  namespace: workbench-builders
  labels:
    app.kubernetes.io/part-of: workbench
spec:
  template:
    ref:
      name: workbench-builder
  harnessRef:
    name: workbench-claude
  egressPolicyRefs:
    - name: workbench-gitlab
    - name: workbench-packages
